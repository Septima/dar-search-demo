<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAWA-autocomplete to dar-search migration</title>
    <style>
      /* DAWA-autocomplete2 styles*/
      .autocomplete-container {
        /* relative position for at de absolut positionerede forslag får korrekt placering.*/
        position: relative;
        width: 100%;
        max-width: 30em;
      }

      .autocomplete-container input {
        /* Både input og forslag får samme bredde som omkringliggende DIV */
        width: 100%;
        box-sizing: border-box;
      }

      .dawa-autocomplete-suggestions {
        margin: 0.3em 0 0 0;
        padding: 0;
        text-align: left;
        border-radius: 0.3125em;
        background: #fcfcfc;
        box-shadow: 0 0.0625em 0.15625em rgba(0, 0, 0, 0.15);
        position: absolute;
        left: 0;
        right: 0;
        z-index: 9999;
        overflow-y: auto;
        box-sizing: border-box;
      }

      .dawa-autocomplete-suggestions .dawa-autocomplete-suggestion {
        margin: 0;
        list-style: none;
        cursor: pointer;
        padding: 0.4em 0.6em;
        color: #333;
        border: 0.0625em solid #ddd;
        border-bottom-width: 0;
      }

      .dawa-autocomplete-suggestions .dawa-autocomplete-suggestion:first-child {
        border-top-left-radius: inherit;
        border-top-right-radius: inherit;
      }

      .dawa-autocomplete-suggestions .dawa-autocomplete-suggestion:last-child {
        border-bottom-left-radius: inherit;
        border-bottom-right-radius: inherit;
        border-bottom-width: 0.0625em;
      }

      .dawa-autocomplete-suggestions
        .dawa-autocomplete-suggestion.dawa-selected,
      .dawa-autocomplete-suggestions .dawa-autocomplete-suggestion:hover {
        background: #f0f0f0;
      }
    </style>
    <!-- Old DAWA-autocomplete script -->
    <!--
    <script src="https://cdn.dataforsyningen.dk/dawa/assets/dawa-autocomplete2/1.0.2/dawa-autocomplete2.min.js"></script>
    -->
    <!-- New DAR-search script -->
    <script src="../dawa-autocomplete.iife.js"></script>
  </head>
  <body>
    <h1>DAWA-autocomplete to dar-search migration test</h1>

    <article>
      <h2>CDN version</h2>

      <!-- HTML -->
      <div class="autocomplete-container">
        <input type="search" id="dawa-autocomplete-input" />
        <!-- Suggestions will appear here -->
      </div>

      <!-- Javascript -->
      <script>
        /* Old Old DAWA-autocomplete script  */
        /*
        dawaAutocomplete.dawaAutocomplete(
          document.getElementById("dawa-autocomplete-input"),
          {
            select: function (selected) {
              console.log("Valgt adresse: " + selected.tekst);
            }
          },
        );
        */
        /* New DAR-search script */
        dawaAutocomplete.dawaAutocomplete(
          document.getElementById("dawa-autocomplete-input"),
          {
            select: function (selected) {
              console.log("Valgt adresse: " + selected.title);
            },
            token: "demo-3KCVX33CKZ",
          },
        );
      </script>
    </article>
  </body>
</html>
